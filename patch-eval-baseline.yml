# patch-eval-baseline.yml —— 分派 08：基线臂（内建 loop，minimal 配置）+ 中立探针
#
# 基线定义（08 号任务书交付 3）：内建 agent-loop 原样运行（minimal 配置 = 不做任何
# 行为调参）；唯一附加是 eval-probe（两臂同装的测量仪器，只读透传，METRICS.md E4）。
# 对照臂用 patch-eval-stream.yml；任务集/seed/探针两臂逐字节相同（控制变量红线）。
#
# 用法：
#   dsh --profile headless --patch <本文件绝对路径> headless "<任务文本>"
#   env: DSH_EVAL_PROBE_DIR=<每任务每臂独立目录>（runner 设置）

# ⚠ bundle 安装形态隔离（2026-11-15 增补）：本包经 dsh plugin add 安装后，bundle 层会
# 停用内建 agent-loop 并插入五个生产 entry。基线臂必须用覆盖行恢复原生形态，
# 否则基线被对照臂实现劫持（--patch 层优先级最高，覆盖 bundle 层的同 id 行）。
- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  disabled: false
- id: stream-agent
  disabled: true
- id: stream-agent-state
  disabled: true
- id: stream-agent-obs-broker
  disabled: true
- id: stream-agent-action-gate
  disabled: true
- id: stream-agent-context-render
  disabled: true

- insert:
    - id: stream-agent-eval-probe
      name: ./dist/entry/eval-probe.js
      inject: []
      config:
        announce: true
