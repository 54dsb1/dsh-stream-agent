# patch-takeover.yml —— 单流协议 loop 接管 patch（分派 06；探针 A 第二轮路线的正式化）
#
# 方言规则（results/01-micro-spike-results.md §0 实测）：
#   - 覆盖既有行用裸 "- id: X"（本文件第一段：停用内建 agent-loop）；
#   - 新增组合行必须用 insert:（裸新增行会被静默跳过）；
#   - 顶层行的相对路径锚点是本 patch 文件所在目录（dsh-stream-agent 包根）；
#   - preset 嵌套行静默失败——关键行绝不藏进 preset plugins。
#
# 用法（接管）：
#   dsh --profile headless --patch <本文件绝对路径> headless "<任务>"
# 卸载/回滚：不挂本 patch 即回到内建 loop（disabled 覆盖行是 patch 层的，零残留）。
#
# announceTakeover: true 在 stderr 打一行接管横幅（排障自证；探针 A 实测
# preset/patch 激活对 CLI 静默，接管与否只能靠插件自证日志或 session log 对账）。

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
    maxParallelToolCalls: 10
  disabled: true
- insert:
    - id: stream-agent
      name: ./dist/entry/loop.js
      # inject 在 patch 行必须显式声明（loader 读 entry.options.inject，
      # cordis-plugin-loader/lib/index.js:768——模块导出的 inject 不进 patch 行）
      inject: [llm, tools, agents, sessions, sessionProjections]
      config:
        announceTakeover: true
        maxParallelToolCalls: 3
        maxReentries: 8
        streamIdleTimeoutMs: 30000
