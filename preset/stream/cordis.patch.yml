# preset-stream 独立 bundle（S4）——随包交付，profile 组合中列在主 bundle 之后。
#
# 只列映射工具（会话可见工具 = 映射清单；未列工具 0 调用）：
#   tf-write/tf-read/tf-edit/tf-append → dsh-tool-fs 的 write/read/edit（applyPatch 开启给 tf-append 的 EOF 追加）
#   tf-bash                            → dsh-tool-pwsh（Windows）/ dsh-tool-bash（POSIX，二选一）
#   tf-grep/tf-glob                    → dsh-tool-fs-search 的 grep/glob
#
# 不列 persona / agent-instructions / time-context / plan-mode / compaction 等行：
# 它们由宿主或主 bundle 处理，preset 重复声明只会增加装配面（S4 约束）。
# 本 bundle 不碰 agent-loop、不接管 loop——那只在主 bundle 的 cordis.patch.yml。
#
# registry 默认值不在这里改：那是 profile patch 层的覆盖声明（见 profiles/stream/cordis.patch.yml），
# 这样 headless 组合（无 registry）不引入本行也不会悬空。

- insert:
    - id: preset-stream
      name: '@deepseek-ai/dsh-agent-preset'
      inject: [agentPresets]
      config:
        id: stream
        name: Stream
        description: dsh-stream-agent 单流协议专用工具面（write/read/edit/append + shell + grep/glob）
        order: 99
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              # tf-append（无 anchor）的 EOF 追加走宿主 apply_patch（*** End of File 锚）
              applyPatch: true
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
