# cordis.patch.yml —— DSH bundle 层组合声明（官方插件格式，package.json > dsh.bundle.patch 指向本文件）
#
# 与 patch-takeover.yml 的关系：
#   - 本文件是 **bundle 安装形态**的入口（dsh plugin add 后由 launcher 作为组合包层应用）；
#   - patch-takeover.yml 是 **开发/patch 形态**的入口（--patch 顶层叠加，锚点为补丁文件旁）。
#   两者停用内建 agent-loop + 挂本插件 entry 的语义一致；卸载本包即两层全部消失。
#
# 方言规则（results/01-micro-spike-results.md §0 实测）：
#   - 覆盖既有行用裸 "- id: X"（停用内建 agent-loop）；
#   - 新增组合行必须用 insert:（裸新增行会被静默跳过）；
#   - 相对路径 ./dist/... 按 cordis-plugin-loader 的 import(name) 语义以本文件 URL 为
#     baseUrl 解析（lib/index.js:343-345）——本文件位于包根，安装形态下指向包内 dist。
#
# announce: true 使每个 entry 在 stderr 打一行 mounted 横幅——实测 bundle 激活对 CLI 静默，
# 插件必须自证（探针 A §0 / 07 号 §5.0 纪律）；排障后可整行删去 config 关闭。
#
# 红线：mock-provider / eval-probe 是测试设施，绝不进本组合（05 号 §4 grep 自证纪律）。

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  disabled: true

- insert:
    # 装载顺序（07 号宿主冒烟实证）：sidecar entry 全部先行挂载，stream-agent（loop）最后——
    # loop 接管后单流若快速终止，进程退出会截断尚未挂载 entry 的激活。
    # inject 必须逐行显式声明（loader 只读 entry.options.inject，模块导出不进 patch 行——
    # cordis-plugin-loader/lib/index.js:768，06 号 §4 实测）。
    - id: stream-agent-state
      name: ./dist/entry/state-handle.js
      inject: [storage]
      config:
        unit: tfAgentState
        announce: true
    - id: stream-agent-obs-broker
      name: ./dist/entry/obs-broker.js
      inject: [tools, state]
      config:
        announce: true
    - id: stream-agent-action-gate
      name: ./dist/entry/action-gate.js
      inject: [tools, storage]
      config:
        announce: true
    - id: stream-agent-context-render
      name: ./dist/entry/context-render.js
      inject: []
      config:
        announce: true
    - id: stream-agent
      name: ./dist/entry/loop.js
      inject: [llm, tools, agents, sessions, sessionProjections]
      config:
        announceTakeover: true
        maxParallelToolCalls: 3
        maxReentries: 8
        streamIdleTimeoutMs: 30000
