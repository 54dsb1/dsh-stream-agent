# patch-adapters-smoke.yml —— 07 号四 entry 宿主装载冒烟 patch（不进生产装配）
#
# 用途：验证四个 07 号 entry 在真实宿主（DeepSeek Harness headless）的装载与接线——
#   state-handle 的 ctx.provide('state')、obs-broker/context-render 的 ctx.on 挂载、
#   action-gate 的 ctx.tools.guard 注册。无 API Key，任务在 MISSING_CREDENTIAL 终止，
#   但装载与接线先于任何 LLM 调用完成——失败形态见 results/07-plugin-adapters-results.md §5。
# 方言规则同 patch-takeover.yml（覆盖行停内建 loop；新增行用 insert；行内显式 inject）。

- id: agent-loop
  name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
    maxParallelToolCalls: 10
  disabled: true
- insert:
    - id: stream-agent
      name: ./dist/entry/loop.js
      inject: [llm, tools, agents, sessions]
      config:
        announceTakeover: true
        streamIdleTimeoutMs: 30000
    - id: stream-agent-state
      name: ./dist/entry/state-handle.js
      inject: [storage]
      config:
        unit: tfAgentState
        announce: true
    - id: stream-agent-obs-broker
      name: ./dist/entry/obs-broker.js
      inject: [tools, state]
      config:
        announce: true
    - id: stream-agent-action-gate
      name: ./dist/entry/action-gate.js
      inject: [tools, storage]
      config:
        announce: true
    - id: stream-agent-context-render
      name: ./dist/entry/context-render.js
      inject: []
      config:
        announce: true
